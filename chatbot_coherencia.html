<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Coherencia Somática v1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #000 url('consola_bg.jpg') no-repeat center center/cover;
            font-family: 'Orbitron', sans-serif; color: #00f2ff; overflow: hidden;
        }

        .consola { 
            width: 650px; background: rgba(0, 10, 20, 0.85); backdrop-filter: blur(20px);
            padding: 30px; border: 1px solid #00f2ff; border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.2);
        }

        #chat-window { 
            height: 300px; overflow-y: auto; margin-bottom: 20px; 
            border-bottom: 1px solid #333; padding-right: 10px; font-size: 0.9em;
        }

        .input-area { display: flex; gap: 10px; }
        input { flex: 1; background: transparent; border: 1px solid #00f2ff; color: white; padding: 12px; }
        button { background: #00f2ff; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        
        .stats-bar { display: flex; justify-content: space-between; margin-top: 15px; font-size: 0.7em; opacity: 0.8; }
    </style>
</head>
<body>

<div class="consola">
    <div id="chat-window">
        <p>SISTEMA: Conexión establecida. Protocolo de coherencia activo.</p>
        <p>DESCRIBE TU ESTADO PARA INICIAR DIAGNÓSTICO.</p>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ej: Me siento estresado...">
        <button onclick="procesar()">ANALIZAR</button>
    </div>

    <div class="stats-bar">
        <span id="stats">NEUTRALIZACIONES: 0 | SOSTENIMIENTOS: 0</span>
        <span>ESTADO: ACTIVO</span>
    </div>
</div>

<script>
    let stats = { contraccion: 0, expansion: 0 };

    function procesar() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-window');
        const texto = input.value.toLowerCase();
        
        if (!texto) return;

        // Mostrar entrada del usuario
        chat.innerHTML += `<p style="color:#aaa">>> ${input.value}</p>`;
        
        // Lógica de diagnóstico inteligente
        let respuesta = "SISTEMA: Analizando firma vibratoria...";
        
        if (texto.includes('miedo') || texto.includes('estrés') || texto.includes('enojado') || texto.includes('ansioso')) {
            stats.contraccion++;
            respuesta = "DETECTADO: Patrón de contracción. Protocolo sugerido: NEUTRALIZAR. Realiza respiración profunda.";
        } else if (texto.includes('feliz') || texto.includes('paz') || texto.includes('bien') || texto.includes('amor')) {
            stats.expansion++;
            respuesta = "DETECTADO: Patrón de expansión. Protocolo sugerido: SOSTENER. Mantén la frecuencia.";
        } else {
            respuesta = "Diagnóstico neutro. Continúa observando el campo.";
        }

        // Actualizar UI
        chat.innerHTML += `<p style="color:white">${respuesta}</p>`;
        document.getElementById('stats').innerText = `NEUTRALIZACIONES: ${stats.contraccion} | SOSTENIMIENTOS: ${stats.expansion}`;
        
        chat.scrollTop = chat.scrollHeight;
        input.value = "";
    }
</script>

</body>
</html>
